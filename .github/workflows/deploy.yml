name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build all projects
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          
          # Auto-discover ALL experiments (any dir with package.json, excluding landing/references)
          for dir in */; do
            dir="${dir%/}"
            if [ "$dir" = "landing" ] || [ "$dir" = "references" ] || [ "$dir" = "node_modules" ] || [ "$dir" = ".github" ]; then
              continue
            fi
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Building $dir..."
              
              # Ensure next.config has correct basePath
              if [ -f "$dir/next.config.ts" ]; then
                if ! grep -q "design-lab/$dir" "$dir/next.config.ts"; then
                  echo "⚠️  Fixing basePath for $dir"
                  sed -i "s|basePath: \"/$dir\"|basePath: \"/design-lab/$dir\"|" "$dir/next.config.ts"
                fi
                if ! grep -q 'output.*export' "$dir/next.config.ts"; then
                  echo "⚠️  Adding output:export for $dir"
                  sed -i 's|const nextConfig: NextConfig = {|const nextConfig: NextConfig = {\n  output: "export",\n  images: { unoptimized: true },|' "$dir/next.config.ts"
                fi
              fi
              
              # Ensure build script exists
              if ! grep -q '"build"' "$dir/package.json"; then
                echo "⚠️  Adding build script for $dir"
                sed -i 's|"scripts": {|"scripts": {\n    "build": "next build",|' "$dir/package.json"
              fi
              
              cd "$dir"
              npm ci --legacy-peer-deps 2>/dev/null || npm install --legacy-peer-deps
              npm run build || true
              if [ -d "out" ]; then
                cp -r out "../_site/$dir"
                echo "✅ $dir built"
              else
                echo "❌ $dir failed"
              fi
              cd ..
            fi
          done
          
          # Copy landing page
          if [ -f "landing/index.html" ]; then
            cp landing/index.html _site/index.html
          fi
          
          # Summary
          echo ""
          echo "=== Build Summary ==="
          echo "Total deployed: $(ls -d _site/*/ 2>/dev/null | wc -l) experiments"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
