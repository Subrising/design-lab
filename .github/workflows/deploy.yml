name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build all projects
        run: |
          mkdir -p _site
          
          # Build each project as static export
          for dir in apple-scroll aurora bento-grid bubble-metaballs clerk creative-studio dark-machine dennis-snellenberg fashion-runway horizontal-gallery immersive-garden immersive-story jason-bergh kinetic-typography lando-norris linear liquid-glass magnetic-cursor neon-rated obsidian ohzi-interactive parallax-scrollytelling product-launch raycast sticky-grid stripe studio-dialect text-morphing unseen-studio wavy-carousels zajno-motion ; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Building $dir..."
              cd "$dir"
              npm ci --legacy-peer-deps 2>/dev/null || npm install --legacy-peer-deps
              npm run build || true
              if [ -d "out" ]; then
                cp -r out "../_site/$dir"
                echo "✅ $dir built"
              else
                echo "❌ $dir failed"
              fi
              cd ..
            fi
          done
          
          # Copy landing page
          cp landing/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
